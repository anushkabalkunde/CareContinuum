name: Build CareContinuum APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite production bundle
        run: npm run build
        env:
          GEMINI_API_KEY: "not_needed_for_android_build"
          NODE_ENV: production

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Patch network security config
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

      - name: Set gradlew permissions
        run: chmod +x android/gradlew

      - name: Build debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -Pandroid.useAndroidX=true

      - name: Locate and rename APK
        run: |
          APK_SRC=$(find android -name "app-debug.apk" | head -1)
          cp "$APK_SRC" CareContinuum-debug.apk

      - name: Upload CareContinuum APK
        uses: actions/upload-artifact@v4
        with:
          name: CareContinuum-debug-apk
          path: CareContinuum-debug.apk
          retention-days: 30
          if-no-files-found: error
